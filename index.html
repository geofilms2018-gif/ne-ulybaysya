<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Не улыбайся</title>
<style>
  :root{--bg:#000;--fg:#fff;--mut:#a8a8a8;--live:#ff0050;--ig:linear-gradient(45deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;overflow:hidden}
  .scr{position:fixed;top:0;left:0;right:0;height:var(--tg-viewport-stable-height,100%);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));gap:14px;text-align:center}
  .scr.on{display:flex}
  #home{background:radial-gradient(120% 80% at 50% 0%,#2a0a3a 0%,#000 60%)}
  .logo{width:96px;height:96px;border-radius:28px;background:var(--ig);display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:0 10px 40px #d6297666}
  h1{font-size:34px;margin:6px 0 0;font-weight:800;letter-spacing:-.5px}
  h1 span{background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0;color:var(--mut);font-size:15px}
  input{width:100%;max-width:340px;font-size:18px;padding:14px 16px;border-radius:12px;border:1px solid #363636;background:#121212;color:var(--fg);text-align:center;outline:none}
  input:focus{border-color:#a8a8a8}
  input.code{text-transform:uppercase;letter-spacing:8px;font-weight:800}
  button{width:100%;max-width:340px;font-size:17px;font-weight:700;padding:15px;border-radius:12px;border:0;background:#0095f6;color:#fff}
  button.grad{background:var(--ig);box-shadow:0 8px 30px #d6297655}
  button.sec{background:#262626;color:var(--fg)}
  button:active{transform:scale(.97)}
  .row{display:flex;gap:10px;width:100%;max-width:340px}
  .livepill{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;font-weight:800;font-size:13px;padding:4px 8px;border-radius:6px;letter-spacing:.5px}
  .bigcode{font-size:52px;font-weight:900;letter-spacing:10px;background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
  #players{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:360px;margin-top:6px}
  .av{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;width:72px}
  .ring{width:68px;height:68px;border-radius:50%;padding:3px;background:var(--ig);animation:pop .4s}
  .ring b{display:flex;width:100%;height:100%;border-radius:50%;background:#262626;border:3px solid #000;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .av span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  #game{padding:0;justify-content:flex-start}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .shade{position:absolute;inset:0;background:linear-gradient(#0009 0,#0000 22%,#0000 60%,#000b 100%);z-index:1;pointer-events:none}
  .top{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;z-index:2}
  .me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .me .ring{width:34px;height:34px;padding:2px;animation:none}
  .me .ring b{font-size:14px;border-width:2px}
  .viewers{display:inline-flex;align-items:center;gap:5px;background:#0006;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:700;font-size:13px;padding:4px 8px;border-radius:6px}
  .sp{flex:1}
  .hud{position:absolute;left:0;right:0;top:calc(64px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
  #clock{font-size:60px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px #000a}
  #status{font-size:15px;font-weight:700;background:#0006;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 12px;border-radius:20px}
  .meter{width:55%;height:6px;border-radius:3px;background:#fff3;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--ig);transition:width .08s}
  #feed{position:absolute;left:12px;right:80px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:2;display:flex;flex-direction:column;gap:8px;align-items:flex-start;-webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%);max-height:40vh;overflow:hidden;justify-content:flex-end}
  .cm{display:flex;gap:8px;align-items:center;font-size:14px;text-align:left;animation:up .3s}
  .cm .ring{width:28px;height:28px;padding:2px;flex:none;animation:none}
  .cm .ring b{font-size:12px;border-width:2px}
  .cm em{font-style:normal;font-weight:700;margin-right:6px}
  @keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  #hearts{position:absolute;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60vh;z-index:2;pointer-events:none}
  .ht{position:absolute;bottom:0;left:16px;font-size:30px;animation:fly 2.6s ease-out forwards}
  @keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-55vh) scale(1.2);opacity:0}}
  .pvwrap{position:relative;width:150px;height:190px;border-radius:22px;overflow:hidden;padding:3px;background:var(--ig);flex:none}
  .pvwrap video{border-radius:19px;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px)}
  #lobby{gap:10px}
  .scr>*{flex-shrink:0} #lobby>:first-child,#home>:first-child{margin-top:auto} #lobby>:last-child,#home>:last-child{margin-bottom:auto}
  #game{overflow:hidden}
  #btnStart{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5}
  #lobby .bigcode{font-size:40px}
  .ring b img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .av.ok .ring{box-shadow:0 0 0 2px #2ecc71}
  .av small{color:var(--mut);font-size:11px}
  #grid{position:absolute;inset:0;display:grid;gap:2px;background:#000;grid-template-columns:1fr;grid-auto-rows:1fr}
  #grid.n4,#grid.n5,#grid.n6{grid-template-columns:1fr 1fr}
  .tile{position:relative;overflow:hidden;background:#111}
  .tile video{width:100%;height:100%;object-fit:cover}
  .ph .ring{width:76px;height:76px}
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px}
  .tile.live .ph,.tile.fbon .ph{display:none}
  .tile img.fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
  .tile.fbon:not(.live) img.fb{display:block}
  .tile .na{position:absolute;left:10px;top:10px;z-index:2;display:none;font-size:12px;background:#000a;padding:3px 7px;border-radius:9px}
  body.voice .tile.noaud .na{display:block}
  .mic{position:absolute;right:8px;bottom:8px;z-index:2;display:none;width:38px;height:38px;padding:0;border-radius:50%;font-size:18px;background:#000a;border:0;color:#fff}
  body.voice .mic{display:block}
  .modes{display:flex;gap:8px;width:100%;max-width:340px}
  .modes button{flex:1;padding:12px 6px;font-size:15px}
  .modes button.on{background:var(--ig);color:#fff}
  .masks{display:flex;gap:8px;overflow-x:auto;width:100%;max-width:360px;padding:4px 2px 8px;scrollbar-width:none}
  .mk{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#1a1a1a;border:2px solid #1a1a1a;border-radius:14px;padding:4px 2px;font-size:10px;color:#ddd;cursor:pointer;position:relative}
  .mk.on{border-color:#ff2d7a} .mk canvas{width:54px;height:54px}
  .mk i{position:absolute;top:2px;right:4px;font-style:normal;font-size:10px}
  .mk.lock canvas{opacity:.55}
  #btnMic{display:none;max-width:220px} body.voice #btnMic{display:block}
  .tname{position:absolute;left:10px;bottom:8px;z-index:1;font-weight:700;font-size:13px;background:#0007;padding:3px 8px;border-radius:10px}
  #prepAv{position:absolute;top:22%;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:4;pointer-events:none}
  #prepAv .pa{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0}
  #prepAv .ring{width:76px;height:76px;animation:none}
  #prepAv .pa span{font-weight:700;font-size:13px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px #000}
  #prepAv.in .pa{animation:flyin .6s cubic-bezier(.2,1.6,.4,1) forwards, bob 1s .6s ease-in-out infinite}
  #prepAv.out .pa{animation:flyout .7s cubic-bezier(.6,-.4,.8,.6) forwards}
  @keyframes flyin{from{transform:translateY(60vh) scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes flyout{from{transform:none;opacity:1}to{transform:translateY(-50vh) scale(2.2) rotate(25deg);opacity:0}}
  #prep{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:170px;font-weight:900;z-index:3;text-shadow:0 4px 30px #000}
  #prep.go{background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
  #res{background:radial-gradient(120% 80% at 50% 30%,#3a0a1f 0%,#000 65%)}
  #cd{font-size:210px;font-weight:900;background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
  #reveal{display:none;flex-direction:column;align-items:center;gap:12px}
  .phring{padding:5px;border-radius:28px;background:var(--ig);transform:rotate(-3deg);animation:pop .5s;box-shadow:0 20px 60px #d6297666}
  .phring img{display:block;width:74vw;max-width:340px;border-radius:24px;border:4px solid #000}
  #loserName{font-size:40px;font-weight:900;text-transform:uppercase;letter-spacing:-.5px}
  .tag{font-size:16px;font-weight:700;color:var(--mut)}
  .err{color:#ed4956}
  .shake{animation:sh .35s infinite}
  @keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px) rotate(-1deg)}75%{transform:translate(5px,-2px) rotate(1deg)}}
</style>
</head>
<body>

<section class="scr on" id="home">
  <div class="logo">😐</div>
  <h1>НЕ <span>УЛЫБАЙСЯ</span></h1>
  <p>Кто первый улыбнётся — проиграл</p>
  <input id="name" placeholder="Твоё имя" maxlength="14" autocomplete="off">
  <button class="grad" id="btnPlay" style="font-size:20px;padding:18px">➕ Создать комнату</button>
  <p style="margin:4px 0 -4px">или войди к друзьям</p>
  <div class="row"><input id="code" class="code" placeholder="КОД" maxlength="4" autocomplete="off" autocapitalize="characters"><button class="sec" id="btnJoin" style="max-width:140px">Войти</button></div>
  <p id="inviteHint" style="display:none"></p>
  <p id="homeErr" class="err"></p>
  <button class="sec" id="btnBrowser" style="display:none">🌐 Открыть в браузере</button>
</section>

<section class="scr" id="lobby">
  <span class="livepill">● LIVE скоро</span>
  <p>Код комнаты</p>
  <div class="bigcode" id="roomCode">----</div>
  <p id="lobbyHint"></p>
  <button class="sec" id="btnInvite" style="display:none">📲 Позвать друзей</button>
  <div class="modes" id="modes" style="display:none"><button class="sec on" id="mNear">🤝 Рядом</button><button class="sec" id="mFar">🌍 Дистанционно</button></div>
  <p id="modeHint">Режим: 🤝 рядом — без голоса</p>
  <div class="pvwrap"><video id="pv" playsinline muted autoplay></video><video id="pvMask" playsinline muted autoplay style="display:none"></video></div>
  <button class="sec" id="btnMic">🎤 Микрофон включён</button>
  <div class="masks" id="maskBar"></div>
  <p id="maskHint">Маска — видна всем на твоём видео</p>
  <button class="grad" id="btnFace">📸 Это моё обычное лицо</button>
  <p id="faceHint">Сделай серьёзное лицо и нажми — это будет твоя аватарка</p>
  <div id="players"></div>
  <button class="grad" id="btnStart" style="display:none">Начать эфир</button>
  <p id="lobbyErr" class="err"></p>
</section>

<section class="scr" id="game">
  <div id="grid"><div class="tile" data-id="me"><video id="cam" playsinline muted autoplay></video><video id="meMask" playsinline muted autoplay style="display:none"></video><span class="tname" id="meTile">я</span><button class="mic" id="meMic">🎤</button></div></div>
  <div class="shade"></div>
  <div class="top">
    <div class="me"><div class="ring"><b id="meAv">?</b></div><span id="meName"></span></div>
    <span class="sp"></span>
    <span class="livepill" id="livePill" style="visibility:hidden">LIVE</span>
    <span class="viewers">👁 <span id="viewers">1</span></span>
  </div>
  <div class="hud">
    <div id="clock">0:00.0</div>
    <div id="status">Загружаю распознавание…</div>
    <div class="meter"><i id="meter"></i></div>
  </div>
  <div id="feed"></div>
  <div id="hearts"></div>
  <div id="prepAv"></div>
  <div id="prep"></div>
</section>

<section class="scr" id="res">
  <div id="cd">5</div>
  <div id="reveal">
    <div class="tag" id="loserWhy"></div>
    <div id="loserName"></div>
    <div class="phring"><img id="loserImg" alt=""></div>
    <div class="phring" id="ph2" style="display:none;margin-top:-40px;transform:rotate(4deg)"><img id="loserImg2" alt="" style="width:44vw;max-width:200px"></div>
    <div class="tag" id="loserTime"></div>
    <button class="sec" id="btnShare" style="display:none">Поделиться фоткой</button>
    <button class="grad" id="btnAgain" style="display:none">Ещё раз</button>
    <p id="againHint"></p>
  </div>
</section>

<audio id="sDun" src="zvuki/dundun.mp3" preload="auto"></audio>
<audio id="sRev" src="zvuki/reveal.mp3" preload="auto"></audio>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import {MASKS, faceFrame, previewFrame, drawMask} from "./maski.js";

const $ = id => document.getElementById(id);
const PREFIX = 'ne-ulybaysya-v2-';   // id для видео (WebRTC)
const SMILE_MIN = 0.25;      // порог улыбки (оценка уже без открытого рта); подобран по фото Гео: «чуть улыбка» = 0,32
const SMILE_OVER = 0.2;      // насколько выше спокойного лица
const SMILE_FRAMES = 2, SMILE_HOLD_MS = 100;   // проиграл: 2 кадра подряд с улыбкой или улыбка ≥0,1 с
const DET_W = 256, DET_MS = 66;   // детектор: кадр 256 px, не чаще 15 раз в секунду — телефон не греется
const NOFACE_WARN_MS = 1000, NOFACE_LOSE_MS = 2500; // спрятал лицо = проиграл
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let isHost = false, peer = null, myName = '';
const players = new Map();   // хост: id -> {name, avatar, ready, seen}
let landmarker = null, stream = null;
let phase = 'idle';          // idle | prep | run | done
let t0 = 0, baseline = 0, smileSince = 0, sentSmile = false;
let myAvatar = '', myReady = false, roster = [], calls = new Map();
let lastFaceShot = '', lastShotAt = 0, smileFrames = 0, lastDet = 0, detFps = 0, noFaceSince = 0, lastVideoTime = -1, lastScore = null, modelReady = null, wakeLock = null;

function ini(n){ return (n||'?').trim().charAt(0).toUpperCase() || '?'; }
function esc(n){ return String(n).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function feed(name, text){
  const f = $('feed'), d = document.createElement('div'); d.className = 'cm';
  d.innerHTML = '<div class="ring"><b>' + esc(ini(name)) + '</b></div><div><em>' + esc(name) + '</em>' + esc(text) + '</div>';
  f.appendChild(d); while (f.children.length > 6) f.firstChild.remove();
}
function flyEmoji(e){
  const h = document.createElement('div'); h.className = 'ht'; h.textContent = e;
  h.style.setProperty('--dx', (Math.random()*60-40) + 'px');
  $('hearts').appendChild(h); setTimeout(() => h.remove(), 2700);
}
const REACT = ['😂','🤡','🍑','💀','🫦','🤪','🐸','🍆'];
function heart(){
  const h = document.createElement('div'); h.className = 'ht';
  h.textContent = ['❤️','🔥','😐','🫣','💀'][Math.floor(Math.random()*5)];
  h.style.setProperty('--dx', (Math.random()*60-40) + 'px');
  $('hearts').appendChild(h); setTimeout(() => h.remove(), 2700);
}
setInterval(() => { if (phase === 'run' && Math.random() < .25) heart(); }, 700);
// тап по экрану в раунде — летит смешная реакция всем, чтобы рассмешить
let lastReact = 0;
document.addEventListener('pointerdown', ev => {
  if (phase !== 'run' || ev.target.closest('button,input')) return;
  const now = performance.now(); if (now - lastReact < 250) return; lastReact = now;
  const e = REACT[Math.floor(Math.random()*REACT.length)];
  if (isHost) broadcast({type:'react', e, by: myId}); else { flyEmoji(e); toHost({type:'react', e}); }
});
const NICKS = ['Кирпич','Покерфейс','Камень','Сфинкс','Бетон','Робот','Терминатор','Шрек','Бульдог','Монах'];
function getName(){
  let n = $('name').value.trim();
  if (!n){ try { n = localStorage.getItem('nu_name') || ''; } catch(e){} }
  if (!n) n = NICKS[Math.floor(Math.random()*NICKS.length)] + ' ' + (10 + Math.floor(Math.random()*90));
  try { localStorage.setItem('nu_name', n); } catch(e){}
  return n;
}
function show(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
function fmt(ms){ const s = ms/1000; return Math.floor(s/60) + ':' + (s%60).toFixed(1).padStart(4,'0'); }
function code4(){ const a='ABCDEFGHJKLMNPRSTUVWXYZ'; return Array.from({length:4},()=>a[Math.floor(Math.random()*a.length)]).join(''); }

// iOS открывает звук и камеру только после нажатия — разблокируем звуки на первом тапе
let actx = null; const bufs = {};
function unlockAudio(){
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';  // звук и при выключенном звонке
    if (!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      for (const [k, url] of [['dun','zvuki/dundun.mp3'], ['rev','zvuki/reveal.mp3']])
        fetch(url).then(r => r.arrayBuffer()).then(b => actx.decodeAudioData(b)).then(d => { bufs[k] = d; }).catch(() => {});
    }
    if (actx.state !== 'running') actx.resume();
    const src = actx.createBufferSource(); src.buffer = actx.createBuffer(1, 1, 22050); src.connect(actx.destination); src.start(0);
  } catch(e){}
}
function play(k){
  if (actx && bufs[k]){ if (actx.state !== 'running') actx.resume(); const s = actx.createBufferSource(); s.buffer = bufs[k]; s.connect(actx.destination); s.start(0); return; }
  const a = $(k === 'dun' ? 'sDun' : 'sRev'); a.currentTime = 0; a.play().catch(() => {});
}

async function keepAwake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
// свернул или ушёл в другое приложение посреди раунда = как пропало лицо; вернулся — тихо в ту же комнату
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){
    if (phase === 'run' && !sentSmile){ sentSmile = true; reportSmile(lastFaceShot || snapshot(), 'ушёл(-ла) из эфира'); }
    return;
  }
  if (stream) keepAwake();
  if (stream) initCam().catch(() => {});
  for (const v of document.querySelectorAll('video')) v.play().catch(() => {});
  if (!room) return;
  for (const c of clients) if (!c.connected) try { c.reconnect(); } catch(e){}
  if (isHost) for (const p of players.values()) p.seen = Math.max(p.seen, Date.now());
  else if (inRoom){ lastHello = 0; hello(); }
  if (peer && peer.disconnected && !peer.destroyed) peer.reconnect();
  syncCalls();
});

async function initCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error(TG ? 'Телеграм не дал камеру. Нажми «Открыть в браузере» ниже' : 'Камера недоступна. Открой ссылку в Safari или Chrome, а не внутри Инстаграма'), {name: TG ? 'NotAllowedError' : 'Error'});
  if (stream && stream.active && stream.getVideoTracks().every(t => t.readyState === 'live')){ $('cam').play().catch(()=>{}); return; }
  // некоторые встроенные браузеры молча не показывают запрос камеры — не висим, а говорим, что делать
  stream = await Promise.race([
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:480}, height:{ideal:360}, frameRate:{ideal:15, max:20}}, audio:false}),
    new Promise((_, no) => setTimeout(() => no(new Error('Камера не включилась. Нажми «Разрешить», а если запроса нет — открой ссылку в Safari или Chrome')), 15000))
  ]);
  $('cam').srcObject = stream;

  // камеру включили заново (после сворачивания) — подменяем картинку во всех звонках
  const tr = vidTrack();
  for (const c of calls.values()) try { for (const sd of c.peerConnection.getSenders()) if (sd.track && sd.track.kind === 'video' && sd.track.readyState !== 'live') sd.replaceTrack(tr); } catch(e){}
  await $('cam').play();
}

const detCv = document.createElement('canvas'), detG = detCv.getContext('2d');
const dbg = {old: 0, jaw: 0, s: 0};   // максимумы для тестов
// оценка улыбки 0..1 по уменьшенному кадру; null — лица нет; undefined — кадра нет
function detectRaw(v){
  if (!landmarker || v.readyState < 2 || !v.videoWidth) return undefined;
  const h = Math.round(DET_W * v.videoHeight / v.videoWidth);
  if (detCv.width !== DET_W || detCv.height !== h){ detCv.width = DET_W; detCv.height = h; }
  detG.drawImage(v, 0, 0, DET_W, h);
  const r = landmarker.detectForVideo(detCv, performance.now()), bs = r.faceBlendshapes && r.faceBlendshapes[0];
  faceLm = r.faceLandmarks && r.faceLandmarks[0] || null;
  if (!bs) return null;
  const b = {};
  for (const c of bs.categories) b[c.categoryName] = c.score;
  // открытый рот («а-а», зевок, разговор) тоже поднимает mouthSmile — вычитаем раскрытую челюсть и вытянутые губы
  const smile = ((b.mouthSmileLeft || 0) + (b.mouthSmileRight || 0)) / 2;
  dbg.old = Math.max(dbg.old, b.mouthSmileLeft || 0, b.mouthSmileRight || 0); dbg.jaw = Math.max(dbg.jaw, b.jawOpen || 0);
  return Math.max(0, smile - 1.2 * Math.max(0, (b.jawOpen || 0) - 0.2) - 2 * Math.max(0, (b.mouthFunnel || 0) - 0.08) - Math.max(0, (b.mouthPucker || 0) - 0.15));
}

function snapshot(){
  const v = $('cam'), w = 360, h = Math.round(w * v.videoHeight / v.videoWidth);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.translate(w,0); g.scale(-1,1); g.drawImage(v,0,0,w,h);
  return c.toDataURL('image/jpeg', 0.75);
}

function loop(){
  requestAnimationFrame(loop);
  const play = phase === 'prep' || phase === 'run';
  if (!play && !maskId) return;   // в лобби детектор крутится, только если надета маска
  const now = performance.now(), v = $('lobby').classList.contains('on') ? $('pv') : $('cam');
  if (phase === 'run') $('clock').textContent = fmt(now - t0);
  if (now - lastDet < (play ? DET_MS : 100) || v.currentTime === lastVideoTime) return;
  const s = detectRaw(v);
  if (s === undefined) return;
  detFps = detFps ? detFps * 0.9 + 100 / (now - lastDet) : 1000 / DET_MS;   // реальная частота детектора (для отладки)
  lastDet = now; lastVideoTime = v.currentTime;
  if (maskId) drawOut(v, now);
  if (!play) return;
  if (s !== null) $('meter').style.width = Math.min(100, s*100) + '%';
  if (phase !== 'run') return;
  if (s !== null) dbg.s = Math.max(dbg.s, s);
  if (s === null){
    if (!noFaceSince) noFaceSince = now;
    const gone = now - noFaceSince;
    $('status').textContent = gone > NOFACE_WARN_MS ? '⚠️ Покажи лицо! ' + Math.max(0, (NOFACE_LOSE_MS - gone)/1000).toFixed(1) : 'Лицо не видно';
    if (!sentSmile && gone > NOFACE_LOSE_MS){ sentSmile = true; reportSmile(lastFaceShot || snapshot(), 'спрятал(а) лицо'); }
    smileFrames = 0;
    return;
  }
  noFaceSince = 0;
  $('status').textContent = 'Держись…';
  const thr = Math.max(SMILE_MIN, baseline + SMILE_OVER);
  if (s > thr){
    if (!smileFrames++) smileSince = now;
    if (!sentSmile && (smileFrames >= SMILE_FRAMES || now - smileSince >= SMILE_HOLD_MS)){ sentSmile = true; reportSmile(snapshot(), 'первым(-ой) улыбнулся(-ась)'); }
  } else {
    smileFrames = 0;
    if (now - lastShotAt > 500){ lastShotAt = now; lastFaceShot = snapshot(); }
  }
}

// ---------- сеть ----------
// Игровые сообщения идут через два публичных MQTT-брокера (WSS): им не мешает NAT сотовой сети.
// Каждое сообщение уходит в оба, дубли отбрасываются по mid. WebRTC — только для видео.
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const rid = () => Math.random().toString(36).slice(2, 12);
const myId = rid();
let room = '', clients = [], onNet = null, inRoom = false, lastHost = 0, lastHello = 0, ep = 0;   // ep — номер ведущего: растёт при смене
const seen = new Set(), seenQ = [];
function topic(k){ return 'ne-ulybaysya/v2/' + room + '/' + k; }   // h — создателю, all — всем
function netClose(){ for (const c of clients) try { c.end(true); } catch(e){} clients = []; }
function netOpen(code, willKey, will){
  netClose(); room = code;
  return new Promise((resolve, reject) => {
    let up = false;
    const to = setTimeout(() => { if (!up) reject(new Error('Нет связи с сервером игры. Проверь интернет')); }, 12000);
    for (const url of BROKERS){
      const c = mqtt.connect(url, {clientId: 'nu_' + myId + '_' + rid().slice(0, 4), keepalive: 20, reconnectPeriod: 2000, connectTimeout: 8000,
        will: {topic: topic(willKey), payload: JSON.stringify(will), qos: 1}});
      c.on('connect', () => c.subscribe({[topic('h')]: {qos: 1}, [topic('all')]: {qos: 1}, [topic('x')]: {qos: 0}, [RELAY_T]: {qos: 1}}, err => { if (!err && !up){ up = true; clearTimeout(to); resolve(); } }));
      c.on('message', (t, buf) => {
        let m; try { m = JSON.parse(buf.toString()); } catch(e){ return; }
        if (t === RELAY_T){ relayAnnounce(m); return; }
        if (!m || !m.mid || seen.has(m.mid)) return;
        seen.add(m.mid); seenQ.push(m.mid); if (seenQ.length > 1000) seen.delete(seenQ.shift());
        route(t.endsWith('/h') ? 'h' : t.endsWith('/x') ? 'x' : 'all', m);
      });
      c.on('error', () => {});
      clients.push(c);
    }
  });
}
function pub(k, msg, qos){
  msg.mid = rid(); msg.from = myId; if (isHost) msg.ep = ep;
  seen.add(msg.mid);   // своё эхо не обрабатываем
  const data = JSON.stringify(msg);
  for (const c of clients) try { c.publish(topic(k), data, {qos: qos === 0 ? 0 : 1}); } catch(e){}
}
function toHost(msg){ pub('h', msg); }
function broadcast(msg){ pub('all', msg); handle(msg); }
function sendLobby(){ broadcast({type:'lobby', players: lobbyList(), ph: phase, voice}); }
function lobbyList(){ return [...players.entries()].map(([id, p]) => ({id, name: p.name, avatar: p.avatar || '', ready: !!p.ready, loss: p.loss || 0, v: !!p.v})); }
function route(k, m){
  if (!m.from || m.from === myId) return;
  if (k === 'x'){ frameNet(m); return; }
  if (k === 'h'){ if (isHost) hostNet(m); return; }
  if (isHost){ if ((m.ep || 0) > ep) demote(m); return; }   // в комнате уже есть ведущий новее — уступаем
  if ((m.ep || 0) < ep) return;                              // старый ведущий вернулся — не слушаем
  ep = m.ep || 0;
  guestNet(m);
}
// ведущий пропал: его место занимает следующий игрок по списку, комната живёт дальше
function promote(){
  const old = hostId;
  isHost = true; ep++; hostId = myId; inRoom = true;
  players.clear();
  for (const r of roster) if (r.id !== old) players.set(r.id, r.id === myId ? {name: myName, avatar: myAvatar, ready: myReady, loss: r.loss || 0, v: vidUp(), seen: Infinity} : {name: r.name, avatar: r.avatar, ready: r.ready, loss: r.loss || 0, v: r.v, seen: Date.now()});
  if (!players.has(myId)) players.set(myId, {name: myName, avatar: myAvatar, ready: myReady, loss: 0, seen: Infinity});
  if (phase === 'run'){ hostStart = t0; loserTaken = false; cands = []; }
  $('btnStart').style.display = 'block'; $('btnInvite').style.display = 'block'; $('modes').style.display = 'flex';
  $('lobbyHint').textContent = 'Создатель вышел — теперь ведёшь ты'; $('lobbyErr').textContent = '';
  if (phase === 'done'){ $('btnAgain').style.display = 'block'; $('againHint').textContent = ''; }

function demote(m){

// создатель: принимает сообщения гостей
function hostNet(m){
  const id = m.from;
  const p = players.get(id);
  if (m.type === 'hello'){
    if (p && phase === 'done' && lastLoser) pub('all', {...lastLoser, type:'loser', to: id});
    players.set(id, {name: String(m.name || '?').slice(0, 14), avatar: p ? p.avatar : '', ready: p ? p.ready : false, loss: p ? p.loss : 0, v: !!m.v || !!(p && p.v), seen: Date.now()});
    sendLobby();
    if (!p) broadcast({type:'feed', name: String(m.name || '?').slice(0, 14), text:'присоединился(-ась) к эфиру'});
    return;
  }
  if (!p) return;
  p.seen = Date.now();
  if (m.type === 'ready'){ p.avatar = okAvatar(m.avatar); p.ready = true; sendLobby(); }
  if (m.type === 'react') broadcast({type:'react', e: String(m.e).slice(0, 4), by: id});

}
// гость: слушает создателя
let joinDone = null;
function hello(){

}
function guestNet(m){
  if (m.to && m.to !== myId) return;
  lastHost = Date.now();
  if (hostId !== m.from){ hostId = m.from; if (inRoom){ lastHello = 0; hello(); } }   // новый ведущий — напоминаем о себе

    if (!me){ hello(); if (!inRoom) return; }
    else if (!inRoom){ inRoom = true; if (joinDone) joinDone(); }
  }
  if (!inRoom) return;
  if (m.type === 'react' && m.by === myId) return;
  handle(m);
}
setInterval(() => {

const NORTC = new URLSearchParams(location.search).has('nortc');   // тест «как на сотовой»: WebRTC без связи вообще
const FB_MS = 250, RL_MS = 100, fbCv = document.createElement('canvas'), fbG = fbCv.getContext('2d');

const needAt = new Map(), firstSeen = new Map();
function frameNet(m){

  if (m.type === 'pcm') playPcm(m.from, m.d);

    $('loserTime').textContent = 'продержался(-ась) ' + fmt(m.ms);
    $('reveal').style.display = 'flex';
    $('btnAgain').style.display = isHost ? 'block' : 'none';
    $('btnShare').style.display = (m.photo && navigator.canShare) ? 'block' : 'none';
    lastLoser = m;
    $('againHint').textContent = isHost ? '' : 'Ждём, пока создатель комнаты нажмёт «Ещё раз»';
    play('rev');
  }, 1000);
}

async function joinRoom(){
  myName = getName();
  const code = $('code').value.trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)){ $('homeErr').textContent = 'Введи код из 4 букв'; return; }
  isHost = false; inRoom = false;
  await prepareDevice();
  $('status').textContent = 'Подключаюсь к комнате ' + code + '…';
  ep = 0;
  await netOpen(code, 'h', {type:'bye', mid: rid(), from: myId});
  // зовём создателя, пока он не впишет нас в лобби
  const ok = await new Promise(res => {
    joinDone = () => res(true);
    const t0j = Date.now();
    (function knock(){ if (inRoom) return; if (Date.now() - t0j > 15000) return res(false); lastHello = 0; hello(); setTimeout(knock, 2000); })();
  });
  joinDone = null;
  if (!ok){
    netClose(); room = ''; show('home');
    $('homeErr').textContent = 'Комната ' + code + ' не отвечает. Проверь код — или создатель закрыл игру';
    return;
  }
  lastHost = Date.now();
  $('roomCode').textContent = code;
  $('lobbyHint').textContent = 'Ждём, пока создатель нажмёт СТАРТ';
  $('btnStart').style.display = 'none'; $('btnInvite').style.display = 'none';
  if (!spectate()) show('lobby');
  startVideo();
}

function camHelp(e){
  const n = e && e.name, ua = navigator.userAgent;
  if (n === 'NotAllowedError' || n === 'SecurityError'){
    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData || /Telegram/i.test(ua)) return 'Телеграм не дал камеру. Нажми «Открыть в браузере» ниже и разреши камеру там';
    if (IOS) return 'Камера запрещена. Нажми «аА» слева в адресной строке → Настройки веб‑сайта → Камера → Разрешить, и обнови страницу';
    return 'Камера запрещена. Нажми 🔒 слева от адреса → Разрешения → Камера → Разрешить, и обнови страницу';
  }
  if (n === 'NotReadableError' || n === 'AbortError') return 'Камера занята другим приложением (FaceTime, Инстаграм, звонок). Закрой его и нажми ещё раз';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Не нашёл фронтальную камеру на этом устройстве';
  return 'Не получилось: ' + ((e && e.message) || e);
}
function guard(fn){ return async () => {
  $('homeErr').textContent = '';
  try { await fn(); }
  catch(e){ show('home'); $('homeErr').textContent = camHelp(e); $('btnBrowser').style.display = TG ? 'block' : 'none'; }
}; }

// ---------- Telegram Mini App: без сервера и без токена бота ----------
// Ссылка-приглашение: t.me/<TG_BOT>/<TG_APP>?startapp=КОД. Пока бот не заведён (пусто) — зовём обычной ссылкой на сайт.

const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
if (TG){
  try {
    TG.ready(); TG.expand();
    TG.setHeaderColor('#000000'); TG.setBackgroundColor('#000000');   // игра в стиле эфира — всегда тёмная, шапку Телеграма красим в тон
    if (TG.disableVerticalSwipes) TG.disableVerticalSwipes();          // свайп вниз не закрывает игру посреди раунда
  } catch(e){}
}
// заготовка под Stars и подарки: TG.openInvoice(ссылка_на_счёт) — счёт выставляет бот, в коде страницы токена нет
const TG_START = TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param || '';
const INVITE = (new URLSearchParams(location.search).get('r') || TG_START || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
try { $('name').value = localStorage.getItem('nu_name') || ''; } catch(e){}
if (!$('name').value) $('name').value = (new URLSearchParams(location.search).get('n') || '').slice(0, 14);
if (!$('name').value && TG && TG.initDataUnsafe && TG.initDataUnsafe.user) $('name').value = String(TG.initDataUnsafe.user.first_name || '').slice(0, 14);
if (INVITE.length === 4){
  $('code').value = INVITE;
  $('btnJoin').className = 'grad'; $('btnPlay').className = 'sec';
  $('inviteHint').style.display = 'block'; $('inviteHint').textContent = 'Тебя позвали в комнату ' + INVITE + ' — жми «Войти»';
}

$('btnInvite').onclick = async () => {
  const code = $('roomCode').textContent, text = 'Го в эфир, кто первый улыбнётся — проиграл 😐';
  if (TG && !TG_APP){   // пока нет /newapp: зовём в бота и даём код
    const t = 'Го в эфир «Не улыбайся» 😐 Открой @' + TG_BOT + ' → «Играть» → код ' + code;
    TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/' + TG_BOT) + '&text=' + encodeURIComponent(t)); return;
  }
  const url = TG_BOT && TG_APP ? 'https://t.me/' + TG_BOT + '/' + TG_APP + '?startapp=' + code : location.origin + location.pathname + '?r=' + code;
  if (TG){ TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text)); return; }
  try { if (navigator.share){ await navigator.share({title: 'Не улыбайся', text, url}); return; } } catch(e){ return; }
  try { await navigator.clipboard.writeText(url); $('btnInvite').textContent = '✅ Ссылка скопирована'; } catch(e){ prompt('Ссылка для друзей', url); }
};

$('btnBrowser').onclick = () => {

  if (/^[A-Z]{4}$/.test(code)) q.set('r', code);

  const url = location.origin + location.pathname + (q.toString() ? '?' + q : '');
  if (TG) TG.openLink(url); else location.href = url;
};
function smallShot(v){
  const sz = 160, c = document.createElement('canvas'); c.width = c.height = sz;
  const k = Math.min(v.videoWidth, v.videoHeight), g = c.getContext('2d');
  g.translate(sz, 0); g.scale(-1, 1);
  g.drawImage(v, (v.videoWidth - k)/2, (v.videoHeight - k)/2, k, k, 0, 0, sz, sz);
  return c.toDataURL('image/jpeg', 0.7);
}
// калибровка по видимому превью лобби: спрятанное видео на телефонах может стоять на паузе
async function calibrate(){
  const v = $('pv'), out = [];
  let end = performance.now() + 8000;   // первый прогон модели бывает долгим — считаем 2.5 с от первого кадра
  let lt = -1;
  v.play().catch(() => {});
  while (performance.now() < end && out.length < 8){
    await new Promise(r => setTimeout(r, 50));
    if (v.readyState < 2 || v.currentTime === lt) continue;
    lt = v.currentTime;
    const x = detectRaw(v);
    if (x === null || x === undefined) continue;
    if (!out.length) end = Math.min(end, performance.now() + 2500);
    out.push(x);
  }
  return out;
}
$('btnFace').onclick = async () => {
  unlockAudio();
  if (!landmarker){ $('faceHint').textContent = 'Ещё загружаю распознавание, секунду…'; return; }
  if (phase !== 'idle') return;
  try { await initCam(); } catch(e){ $('faceHint').textContent = camHelp(e); return; }
  $('btnFace').disabled = true; $('faceHint').textContent = 'Замри… 😐';
  let calib = [];
  try { calib = await calibrate(); } catch(e){ console.warn('calib', e); }
  $('btnFace').disabled = false;
  if (calib.length < 3){ $('faceHint').textContent = 'Лицо не нашёл 💡 Больше света, лицо целиком в рамку — и нажми ещё раз'; return; }
  const sorted = calib.slice().sort((a, b) => a - b), med = sorted[Math.floor(sorted.length/2)];
  if (med > 0.5){ $('faceHint').textContent = 'Ты улыбаешься 😏 Сделай серьёзное лицо и нажми ещё раз'; return; }
  baseline = Math.min(0.25, med);
  const v = $('pv'); myAvatar = smallShot(v.videoWidth ? v : $('cam')); myReady = true;
  $('btnFace').textContent = '🔄 Переснять'; $('faceHint').textContent = 'Готово ✅ Это твоё обычное лицо';
  if (isHost){ const p = players.get(myId); if (p){ p.avatar = myAvatar; p.ready = true; } sendLobby(); }
  else toHost({type:'ready', avatar: myAvatar});
};

document.addEventListener('touchend', unlockAudio, {once: true});
initModel().catch(() => {});   // модель (~10 МБ) грузим сразу на главном экране
